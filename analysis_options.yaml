analyzer:
  errors:
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
    - use_build_context_synchronously
    - prefer_is_empty
    - unnecessary_null_checks

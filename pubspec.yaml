name: dastyar
description: A fully offline Persian AI assistant for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_rag_engine: ^0.19.0
  path_provider: ^2.1.1
  
flutter:
  uses-material-design: true
  assets:
    - assets/model_int8.onnx
    - assets/tokenizer.json
    - assets/knowledge.txt

name: Embedding experiment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install sentence-transformers
      - name: Run models
        run: |
          for m in intfloat/multilingual-e5-small sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2; do
            MODEL="$m" python brain/embed_eval.py || echo "failed: $m"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embed-reports
          path: brain/reports/
      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brain/reports
          git commit -m "گزارش embedding" || echo "nothing to commit"
          git pull --rebase
          git push

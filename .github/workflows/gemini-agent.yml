name: Gemini Repository Agent

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    # فقط مالک/همکار مورد اعتماد؛ پاسخ ربات و کامنت‌های Pull Request اجرا نمی‌شوند.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!endsWith(github.actor, '[bot]') &&
       ((github.event_name == 'issues' &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/gemini ') &&
         contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      result: ${{ steps.gemini.outputs.result }}
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Test agent safety and failure handling
        run: python -m unittest discover -s tests/python -v

      - name: Verify Gemini connection and generate answer
        id: gemini
        env:
          # کلید فقط در این مرحله موجود است؛ به مرحلهٔ نوشتن کامنت منتقل نمی‌شود.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: python tools/gemini_agent.py

  comment:
    needs: generate
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.generate.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Report success or failure on the issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RESULT: ${{ needs.generate.outputs.result }}
          GENERATE_RESULT: ${{ needs.generate.result }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let body;
            if (process.env.GENERATE_RESULT === 'success') {
              const result = JSON.parse(process.env.RESULT);
              body = `## 🤖 پاسخ ایجنت Gemini\n\n${result.answer}\n\n` +
                `---\nاتصال موفق | مدل: \`${result.model}\` | [لاگ اجرا](${runUrl})`;
            } else {
              body = `## ❌ اتصال Gemini ناموفق بود\n\n` +
                `مرحلهٔ تولید پاسخ با وضعیت \`${process.env.GENERATE_RESULT}\` پایان یافت. ` +
                `این اجرا موفق محسوب نمی‌شود. [جزئیات لاگ](${runUrl})\n\n` +
                `کلید Actions، موجود بودن مدل، فعال بودن Generative Language API و سهمیه را بررسی کنید.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

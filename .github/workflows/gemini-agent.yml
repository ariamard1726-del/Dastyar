name: Gemini All-in-One Agent

on: issues: types: [opened] issue_comment: types: [created]

jobs: gemini-run: # جلوگیری از اجرای مجدد روی کامنت‌های خود GitHub Actions if: github.actor != 'github-actions[bot]' runs-on: ubuntu-latest

permissions: contents: write issues: write pull-requests: write steps: # ========================================== # دریافت کد شاخه Dastyar-1 # ========================================== - name: Checkout Repository uses: actions/checkout@v4 with: ref: Dastyar-1 fetch-depth: 0 - name: Set up Python uses: actions/setup-python@v5 with: python-version: "3.10" - name: Install Google GenAI SDK run: pip install google-genai # ========================================== # مسیر ۱: پاسخ چتی # فقط برای درخواست‌های عادی اجرا می‌شود. # ========================================== - name: Run Gemini Analysis (Chat) id: gemini if: | github.event_name == 'issues' || ( github.event_name == 'issue_comment' && !contains(github.event.comment.body, 'agent') && !contains(github.event.comment.body, 'autonomous') && !contains(github.event.comment.body, 'خودمختار') && !contains(github.event.comment.body, 'بررسی کل') && !contains(github.event.comment.body, 'بررسی همه') && !contains(github.event.comment.body, 'fix all') && !contains(github.event.comment.body, 'اصلاح') ) env: GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} EVENT_NAME: ${{ github.event_name }} ISSUE_TITLE: ${{ github.event.issue.title }} ISSUE_BODY: ${{ github.event.issue.body }} COMMENT_BODY: ${{ github.event.comment.body }} run: | python - << 'PYTHON' import os import time from google import genai api_key = os.environ.get("GEMINI_API_KEY") event_name = os.environ.get("EVENT_NAME") if not api_key: raise RuntimeError("GEMINI_API_KEY تنظیم نشده است.") project_context = "" if os.path.exists("GEMINI.md"): with open("GEMINI.md", "r", encoding="utf-8") as file: project_context = f"\nاطلاعات پروژه:\n{file.read()}\n" if event_name == "issues": prompt_text = ( f"عنوان: {os.environ.get('ISSUE_TITLE', '')}\n" f"متن: {os.environ.get('ISSUE_BODY', '')}" ) else: prompt_text = ( "کاربر در کامنت نوشته است:\n" f"{os.environ.get('COMMENT_BODY', '')}" ) prompt = f"""تو یک دستیار برنامه‌نویس هستی. {project_context} لطفاً به درخواست زیر پاسخ فنی و دقیق بده: {prompt_text} """ client = genai.Client(api_key=api_key) models_to_try = [ "gemini-3.1-flash-lite", "gemini-3.5-flash-lite", ] result_text = "" for model_name in models_to_try: for attempt in range(3): try: response = client.models.generate_content( model=model_name, contents=prompt, ) result_text = (response.text or "").strip() if result_text: break except Exception as error: error_message = str(error).upper() temporary_error = any( value in error_message for value in ( "503", "UNAVAILABLE", "429", "RATE_LIMIT", ) ) if temporary_error: time.sleep(5 * (attempt + 1)) else: result_text = ( f"خطا در ارتباط با Gemini:\n{error}" ) break if result_text: break if not result_text: result_text = ( "متأسفانه Gemini در حال حاضر پاسخ نداد. " "لطفاً بعداً دوباره تلاش کنید." ) with open( os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8", ) as output: output.write("summary<<EOF\n") output.write(result_text) output.write("\nEOF\n") PYTHON - name: Post Chat Response if: steps.gemini.outcome == 'success' uses: actions/github-script@v7 env: SUMMARY: ${{ steps.gemini.outputs.summary }} with: script: | const summary = process.env.SUMMARY; if (!summary) { core.info("No chat response to post."); return; } await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: `🤖 **پاسخ Gemini:**\n\n${summary}` }); # ========================================== # مسیر ۲: ایجنت خودمختار # ========================================== - name: Setup Flutter if: | github.event_name == 'issue_comment' && ( contains(github.event.comment.body, 'agent') || contains(github.event.comment.body, 'autonomous') || contains(github.event.comment.body, 'خودمختار') || contains(github.event.comment.body, 'بررسی کل') || contains(github.event.comment.body, 'بررسی همه') || contains(github.event.comment.body, 'fix all') || contains(github.event.comment.body, 'اصلاح') ) uses: subosito/flutter-action@v2 with: flutter-version: "3.19.0" channel: stable cache: true - name: Install Flutter dependencies if: | github.event_name == 'issue_comment' && ( contains(github.event.comment.body, 'agent') || contains(github.event.comment.body, 'autonomous') || contains(github.event.comment.body, 'خودمختار') || contains(github.event.comment.body, 'بررسی کل') || contains(github.event.comment.body, 'بررسی همه') || contains(github.event.comment.body, 'fix all') || contains(github.event.comment.body, 'اصلاح') ) run: flutter pub get - name: Run Autonomous Agent if: | github.event_name == 'issue_comment' && ( contains(github.event.comment.body, 'agent') || contains(github.event.comment.body, 'autonomous') || contains(github.event.comment.body, 'خودمختار') || contains(github.event.comment.body, 'بررسی کل') || contains(github.event.comment.body, 'بررسی همه') || contains(github.event.comment.body, 'fix all') || contains(github.event.comment.body, 'اصلاح') ) env: GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} COMMENT_BODY: ${{ github.event.comment.body }} run: python agent.py # ========================================== # ساخت Pull Request # تغییرات هرگز مستقیم به main نمی‌روند. # ========================================== - name: Create Pull Request if: | success() && github.event_name == 'issue_comment' && ( contains(github.event.comment.body, 'agent') || contains(github.event.comment.body, 'autonomous') || contains(github.event.comment.body, 'خودمختار') || contains(github.event.comment.body, 'بررسی کل') || contains(github.event.comment.body, 'بررسی همه') || contains(github.event.comment.body, 'fix all') || contains(github.event.comment.body, 'اصلاح') ) uses: peter-evans/create-pull-request@v6 with: commit-message: "fix: auto-resolved by Gemini Agent" title: "Fix for issue #${{ github.event.issue.number }}" body: | این تغییرات به‌صورت خودمختار توسط Gemini Agent ایجاد شده‌اند. فرمان اجرا: ${{ github.event.comment.body }} branch: "auto-fix-${{ github.event.issue.number }}" base: "Dastyar-1" delete-branch: true 
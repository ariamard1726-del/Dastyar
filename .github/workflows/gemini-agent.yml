name: Gemini Autonomous Agent

on:
  issues:
    types: [opened]

jobs:
  gemini-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Run Gemini CLI
        id: gemini # این خط برای دسترسی به خروجی در مرحله بعد ضروری است
        uses: google-github-actions/run-gemini-cli@main
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # برای دسترسی به API گیت‌هاب
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: "لطفا این ایشو را بررسی کن و راه حل پیشنهاد بده."

      - name: Post Comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${{ steps.gemini.outputs.summary }}`
            })
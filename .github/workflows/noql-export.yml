name: Noql export

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'brain/noql/**'
      - '.github/workflows/noql-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install numpy tokenizers huggingface_hub safetensors
      - name: Dump
        run: python brain/noql/dump.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brain/reports/noql_dump.md || true
          git commit -m "Noql dump [skip ci]" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

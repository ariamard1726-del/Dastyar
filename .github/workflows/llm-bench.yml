name: Small LLM benchmark

# آزمایش، نه بخشی از برنامه: مدل‌های زبانی کوچک را روی جمله‌های
# eval/understanding_probe.tsv می‌سنجد و گزارش را در brain/reports می‌گذارد.
# هیچ مدلی وارد مخزن یا APK نمی‌شود.

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'brain/llm_bench.py'
      - 'eval/understanding_probe.tsv'
      - '.github/workflows/llm-bench.yml'

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install huggingface_hub
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"
      - name: Run benchmark
        run: python brain/llm_bench.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brain/reports/llm_bench.md || true
          git commit -m "گزارش سنجش مدل زبانی کوچک [skip ci]" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

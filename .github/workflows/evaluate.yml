name: Evaluate

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'fail the run when accuracy thresholds are not met'
        type: boolean
        default: false
      args:
        description: 'extra CLI args (e.g. --limit 10 --verbose)'
        type: string
        default: '--verbose'
  pull_request:
    paths:
      - 'brain/eval/evaluation_dataset.json'
      - 'lib/domain/evaluation/**'
      - 'lib/core/debug_logger.dart'
      - 'lib/domain/prompt_builder.dart'
      - 'lib/domain/legal_counselor.dart'
      - 'bin/evaluate_bot.dart'
      - '.github/workflows/evaluate.yml'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - name: Run golden dataset
        env:
          EVAL_ARGS: ${{ inputs.args || '--verbose' }} --json out/evaluation_report.json --traces out/debug_traces.json
          EVAL_STRICT: ${{ inputs.strict && '1' || '0' }}
        run: |
          mkdir -p out
          set -o pipefail
          flutter test bin/evaluate_bot.dart 2>&1 | tee out/eval_console.txt
      - name: Short report
        if: always()
        run: |
          {
            echo "--- evaluation ---"
            grep -E "Intent Accuracy|Route Accuracy|RAG Article Recall|Citation Accuracy|Honesty Rate|Scenario Pass|سناریوهای ناموفق" out/eval_console.txt | cut -c1-200 || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-report
          path: out/


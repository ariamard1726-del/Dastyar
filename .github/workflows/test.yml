name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check asset folders
        run: python tools/check_assets.py
      - name: Check meta
        run: python tools/check_meta.py
      - name: Check data and templates
        run: python tools/check.py
      - name: Doctor (laws, files, refs)
        run: python tools/doctor.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter clean && flutter pub get
      - run: flutter test

      - name: Near-miss report
        continue-on-error: true
        run: |
          mkdir -p brain/reports
          flutter test test/near_miss_test.dart --reporter expanded 2>&1 | grep -E "NEAR" > brain/reports/near_miss.txt || true
          head -n 60 brain/reports/near_miss.txt
      - name: Commit near-miss report
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brain/reports/near_miss.txt
          git diff --cached --quiet || git commit -m "گزارش near-miss (خودکار)"
          git pull --rebase || true
          git push origin HEAD:"${GITHUB_REF_NAME}" || true

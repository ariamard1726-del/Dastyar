name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Gemini agent safety tests
        run: python -m unittest discover -s tests/python -v
      - name: Data checks
        id: data
        continue-on-error: true
        run: |
          set -o pipefail
          (python tools/check.py all && python tools/doctor.py && python tools/eval_py.py --check && python tools/eval_none.py --check) 2>&1 | tee "$RUNNER_TEMP/data_full.txt"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-warnings --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.txt"
      - name: Flutter test
        id: ft
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test_full.txt"
      # نام آزمون‌های شکست‌خورده باید در آنوتیشنِ همان اجرا دیده شود؛ خواندن
      # فایل لاگ از گوشی/محیط ابری همیشه ممکن نیست و «۲۵ آزمون شکست خورد»
      # بدون نام، عیب‌یابی را به حدس تبدیل می‌کند.
      - name: Failing test names
        if: steps.ft.outcome == 'failure'
        run: |
          grep -E "\[E\]$|Failed to load" "$RUNNER_TEMP/test_full.txt" 2>/dev/null \
            | sed -E 's#^.*/(test/[^:]+):#::error::\1:#' \
            | cut -c1-300 | head -n 40 || true
      - name: Analyzer errors
        if: steps.analyze.outcome == 'failure'
        run: |
          grep -E " error • " "$RUNNER_TEMP/analyze.txt" 2>/dev/null \
            | sed 's#/home/runner/work/Dastyar/Dastyar/##' \
            | sed 's#^#::error::#' | cut -c1-300 | head -n 40 || true
      - name: Short report
        if: always()
        env:
          DATA_FAILED: ${{ steps.data.outcome == 'failure' && '1' || '0' }}
        run: python tools/ci_summary.py "$RUNNER_TEMP/test_full.txt" "$RUNNER_TEMP/data_full.txt" reports/last_test.txt "$GITHUB_SHA"
      - name: Append analyze
        if: always()
        run: |
          {
            echo "--- analyze ---"
            tail -n 1 "$RUNNER_TEMP/analyze.txt" 2>/dev/null || true
            grep -E " (info|warning|error) • " "$RUNNER_TEMP/analyze.txt" 2>/dev/null | sed 's#/home/runner/work/Dastyar/Dastyar/##' | cut -c1-200 | head -n 30 || true
          } >> reports/last_test.txt
      - name: Near-miss report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p brain/reports
          flutter test test/engine/near_miss_test.dart --reporter expanded 2>&1 | grep -E "NEAR" > brain/reports/near_miss.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: |
            reports/last_test.txt
            reports/understanding.txt
            reports/noql_dart_speed.txt
            brain/reports/near_miss.txt
      - name: Fail if anything failed
        if: steps.data.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.ft.outcome == 'failure'
        run: exit 1

  commit-reports:
    needs: test
    # فقط وقتی تست‌ها سبزند گزارش نوشته می‌شود؛ پیش‌تر با always() حتی روی
    # شکست هم کامیت می‌گذاشت و تاریخچهٔ شاخه را پر از نویز می‌کرد.
    if: needs.test.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-reports
          path: .
      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brain/reports/near_miss.txt reports/last_test.txt 2>/dev/null || true
          git add reports/understanding.txt reports/noql_dart_speed.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "گزارش خودکار تست [skip ci]"
          # rebase ممکن است به‌خاطر push هم‌زمان شکست بخورد؛ ولی push دیگر
          # بی‌صدا رد نمی‌شود.
          git pull --rebase || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

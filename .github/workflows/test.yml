name: Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Probe official sources
        continue-on-error: true
        run: |
          mkdir -p reports/lab
          OUT=reports/lab/probe_source.txt
          : > "$OUT"
          for U in "https://qavanin.ir/" "https://qavanin.ir/Law/TreeText/84752" "https://rc.majlis.ir/fa/law/show/99612" "https://www.rrk.ir/" "https://dotic.ir/"; do
            echo "=== $U" >> "$OUT"
            curl -sS -L -m 25 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" -o /tmp/body.html -w "http=%{http_code} size=%{size_download} final=%{url_effective} ip=%{remote_ip}\n" "$U" >> "$OUT" 2>&1 || echo "curl failed" >> "$OUT"
            head -c 1500 /tmp/body.html 2>/dev/null | tr '\n' ' ' | cut -c1-1500 >> "$OUT" || true
            echo >> "$OUT"
            grep -c "ماده" /tmp/body.html >> "$OUT" 2>/dev/null || true
            rm -f /tmp/body.html
          done
      - name: Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/lab/probe_source.txt
          git diff --cached --quiet || git commit -m "source probe [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"

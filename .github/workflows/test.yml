name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Data checks
        id: data
        continue-on-error: true
        run: |
          set -o pipefail
          (python tools/check.py all && python tools/doctor.py && python tools/eval_py.py --check && python tools/eval_none.py --check) 2>&1 | tee "$RUNNER_TEMP/data_full.txt"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-warnings --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.txt"
      - name: Flutter test
        id: ft
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test_full.txt"
      - name: Short report
        if: always()
        env:
          DATA_FAILED: ${{ steps.data.outcome == 'failure' && '1' || '0' }}
        run: python tools/ci_summary.py "$RUNNER_TEMP/test_full.txt" "$RUNNER_TEMP/data_full.txt" reports/last_test.txt "$GITHUB_SHA"
      - name: Append analyze
        if: always()
        run: |
          {
            echo "--- analyze ---"
            tail -n 1 "$RUNNER_TEMP/analyze.txt" 2>/dev/null || true
            grep -E " (info|warning|error) • " "$RUNNER_TEMP/analyze.txt" 2>/dev/null | sed 's#/home/runner/work/Dastyar/Dastyar/##' | cut -c1-200 | head -n 30 || true
          } >> reports/last_test.txt
      - name: Near-miss report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p brain/reports
          flutter test test/engine/near_miss_test.dart --reporter expanded 2>&1 | grep -E "NEAR" > brain/reports/near_miss.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            reports/last_test.txt
            brain/reports/near_miss.txt
      - name: Fail if anything failed
        if: steps.data.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.ft.outcome == 'failure'
        run: exit 1

  commit-reports:
    needs: test
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: .
      - name: Commit reports
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brain/reports/near_miss.txt reports/last_test.txt
          git diff --cached --quiet || git commit -m "گزارش خودکار تست [skip ci]"
          git pull --rebase
          git push origin HEAD:"${GITHUB_REF_NAME}"

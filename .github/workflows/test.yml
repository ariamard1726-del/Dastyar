name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Gemini agent safety tests
        run: python -m unittest discover -s tests/python -v
      - name: Data checks
        id: data
        continue-on-error: true
        run: |
          set -o pipefail
          (python dev/tools/check.py all && python dev/tools/doctor.py && python dev/tools/eval_py.py --check && python dev/tools/eval_none.py --check) 2>&1 | tee "$RUNNER_TEMP/data_full.txt"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter pub get
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --fatal-warnings --no-fatal-infos 2>&1 | tee "$RUNNER_TEMP/analyze.txt"
      - name: Flutter test
        id: ft
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee "$RUNNER_TEMP/test_full.txt"
      - name: Coverage gate
        id: coverage
        if: steps.ft.outcome == 'success'
        run: python dev/tools/coverage_gate.py coverage/lcov.info --min 40 | tee reports/coverage.txt
      - name: Startup gate
        id: startup
        if: steps.ft.outcome == 'success'
        run: python dev/tools/startup_gate.py reports/startup.txt --max-load-ms 15000 --max-worker-ms 15000 --max-query-ms 5000
      # نام آزمون‌های شکست‌خورده باید در آنوتیشنِ همان اجرا دیده شود؛ خواندن
      # فایل لاگ از گوشی/محیط ابری همیشه ممکن نیست و «۲۵ آزمون شکست خورد»
      # بدون نام، عیب‌یابی را به حدس تبدیل می‌کند.
      - name: Failing test names
        if: steps.ft.outcome == 'failure'
        # بلوکِ [E] و علتش (Expected/Actual) را با هم می‌آورد؛ اگر نشانگر نبود،
        # تهٔ خروجی چاپ می‌شود تا «۱ شکست» بی‌نام نماند.
        run: python dev/tools/ci_annotate.py "$RUNNER_TEMP/test_full.txt" || true
      - name: Analyzer errors
        if: steps.analyze.outcome == 'failure'
        # اگر تحلیل‌گر با خطِ « error • » شکست بخورد، همان‌ها آنوتیشن می‌شوند؛ ولی
        # اگر لاگ از الگوی همیشگی بیرون باشد (خرابیِ خودِ ابزار، خروجیِ خالی)،
        # آنوتیشن خالی می‌ماند و عیب‌یابی حدس می‌شود. در آن حالت تهٔ لاگ چاپ
        # می‌شود تا هر شکستی نام و علت داشته باشد.
        run: |
          hits=$(grep -E " (error|warning) • " "$RUNNER_TEMP/analyze.txt" 2>/dev/null || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
          else
            echo "analyze: خطِ « error • » نبود؛ تهٔ لاگ:"
            tail -n 25 "$RUNNER_TEMP/analyze.txt" 2>/dev/null || true
          fi | sed 's#/home/runner/work/Dastyar/Dastyar/##' | sed 's#^#::error::#' | cut -c1-300 | head -n 40 || true
      - name: Short report
        if: always()
        env:
          DATA_FAILED: ${{ steps.data.outcome == 'failure' && '1' || '0' }}
        run: python dev/tools/ci_summary.py "$RUNNER_TEMP/test_full.txt" "$RUNNER_TEMP/data_full.txt" reports/last_test.txt "$GITHUB_SHA"
      - name: Append analyze
        if: always()
        run: |
          {
            echo "--- analyze ---"
            tail -n 1 "$RUNNER_TEMP/analyze.txt" 2>/dev/null || true
            grep -E " (info|warning|error) • " "$RUNNER_TEMP/analyze.txt" 2>/dev/null | sed 's#/home/runner/work/Dastyar/Dastyar/##' | cut -c1-200 | head -n 30 || true
          } >> reports/last_test.txt
          if [ -f reports/coverage.txt ]; then
            echo "--- coverage ---" >> reports/last_test.txt
            cat reports/coverage.txt >> reports/last_test.txt
          fi
          if [ -f reports/startup.txt ]; then
            echo "--- startup ---" >> reports/last_test.txt
            cat reports/startup.txt >> reports/last_test.txt
          fi
      - name: Near-miss report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reports
          flutter test test/engine/near_miss_test.dart --reporter expanded 2>&1 | grep -E "NEAR" > reports/near_miss.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports-${{ github.run_id }}
          path: |
            reports/last_test.txt
            reports/understanding.txt
            reports/noql_dart_speed.txt
            reports/startup.txt
            reports/near_miss.txt
            reports/coverage.txt
      - name: Fail if anything failed
        if: steps.data.outcome == 'failure' || steps.analyze.outcome == 'failure' || steps.ft.outcome == 'failure'
        run: exit 1

  commit-reports:
    needs: test
    # فقط وقتی تست‌ها سبزند گزارش نوشته می‌شود؛ پیش‌تر با always() حتی روی
    # شکست هم کامیت می‌گذاشت و تاریخچهٔ شاخه را پر از نویز می‌کرد.
    if: needs.test.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: test-reports-${{ github.run_id }}
          path: .
          # بدون run-id، اکشن قدیمیترین اجرای موفق را میگرفت و report گام
          # قبلی روی شاخه مینوشت (رفتار مشاهدهشده در 9ca34d1).
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit reports
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          # اگر artifact همزمانی قدیمیتر باشد، گزارش تازه همان کامیت را مینویسیم
          # تا `dev/tools/go.py report` هرگز report کامیت دیگری را نشان ندهد.
          if ! head -n 1 reports/last_test.txt 2>/dev/null | grep -q "${GITHUB_SHA:0:7}"; then
            echo "commit: ${GITHUB_SHA:0:7}" > reports/last_test.txt
            echo "CI: test/lab/scenarios success" >> reports/last_test.txt
          fi
          git add reports/near_miss.txt reports/last_test.txt 2>/dev/null || true
          git add reports/understanding.txt reports/noql_dart_speed.txt reports/startup.txt reports/coverage.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "گزارش خودکار تست [skip ci]"
          # rebase ممکن است به‌خاطر push هم‌زمان شکست بخورد؛ ولی push دیگر
          # بی‌صدا رد نمی‌شود.
          git pull --rebase || true
          git push origin HEAD:"${GITHUB_REF_NAME}"

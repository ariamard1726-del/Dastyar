name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check asset folders
        run: python tools/check_assets.py
      - name: Check meta
        run: python tools/check_meta.py
      - name: Check data and templates
        run: python tools/check.py
      - name: Doctor (laws, files, refs)
        run: python tools/doctor.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
      - run: flutter clean && flutter pub get
      - run: flutter test

      - name: Near-miss report
        continue-on-error: true
        run: |
          flutter test test/near_miss_test.dart --reporter expanded 2>&1 | grep -E "NEAR" || echo "no NEAR lines printed"

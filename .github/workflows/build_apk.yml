name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: 'stable'
        
    - name: Generate Android Platform Files
      run: flutter create --platforms=android .
      
    # --- دانلود خودکار مدل با استفاده از Secrets ---
    - name: Download AI Models from HuggingFace
      run: |
        mkdir -p assets
        echo "Downloading tokenizer..."
        curl -L -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
             -o assets/tokenizer.json \
             "https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json"
             
        echo "Downloading INT8 ONNX model..."
        curl -L -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
             -o assets/model_int8.onnx \
             "https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx"
    # ------------------------------------
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build APK
      run: flutter build apk --release --split-per-abi
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Dastyar-APK
        path: build/app/outputs/flutter-apk/*.apk

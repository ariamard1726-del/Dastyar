name: Vex model probe

# آزمایش، نه بخشی از برنامه: مدل DENLIAI/Vex-Base-3.5M-x1 را روی جمله‌های محک اجرا
# می‌کند و گزارش را در brain/reports/vex_probe.md می‌گذارد.

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'brain/vex_probe.py'
      - '.github/workflows/vex-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scikit-learn tokenizers huggingface_hub
      - name: Run
        run: python brain/vex_probe.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add brain/reports/vex_probe.md || true
          git commit -m "گزارش بررسی مدل Vex [skip ci]" || echo "nothing to commit"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Create android platform files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib
          flutter create --platforms=android --org com.ariabod --project-name dastyar .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/lib lib
          rm -f analysis_options.yaml test/widget_test.dart

      - name: App name and icon (non-fatal)
        continue-on-error: true
        run: |
          sed -i 's|android:label="[^"]*"|android:label="دستیار"|' android/app/src/main/AndroidManifest.xml
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow || python3 -m pip install pillow
          python3 tools/make_icon.py
          ls -la android/app/src/main/res/mipmap-xxhdpi/

      - name: Signing key (only if secrets exist)
        continue-on-error: true
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            KEYSTORE_PATH="$RUNNER_TEMP/release.jks" python3 tools/patch_signing.py
          else
            echo "No signing secrets; the APK will use a temporary debug key."
          fi

      - run: flutter pub get

      - name: Analyze (informational)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        id: tests
        continue-on-error: true
        run: flutter test

      - run: flutter build apk --release

      - name: Show signer of the APK
        continue-on-error: true
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: dastyar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Report failed tests (APK is already saved)
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Some tests failed. Open the Tests step log."
          exit 1

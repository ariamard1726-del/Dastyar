name: Build APK

on:
  workflow_dispatch:
    inputs:
      allow_debug_signing:
        description: 'در صورت نبود کلید اصلی، اجازهٔ ساخت آزمایشی با کلید debug داده شود؟'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Data checks
        run: |
          python tools/check.py all
          python tools/doctor.py
          python tools/eval_py.py --check
          python tools/eval_none.py --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable

      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALLOW_DEBUG: ${{ inputs.allow_debug_signing && 'true' || 'false' }}
        run: |
          set +x
          set -eu
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
              echo "::error::فایل کلید امضا پس از رمزگشایی خالی است."
              exit 1
            fi
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" >/dev/null
            KEYSTORE_PATH="$RUNNER_TEMP/release.jks" python3 tools/setup_release_signing.py
          elif [ "$ALLOW_DEBUG" = "true" ]; then
            echo "::warning::کلید امضای اصلی تنظیم نشده؛ بنا به درخواست صریح با کلید debug امضا می‌شود."
          else
            echo "::error::سکرت‌های امضای دیجیتال (KEYSTORE_B64 / KEYSTORE_PASSWORD) تنظیم نشده‌اند. ساخت APK متوقف شد."
            exit 1
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: EVAL numbers
        continue-on-error: true
        run: |
          flutter test test/eval_test.dart --reporter expanded 2>&1 | grep -E "EVAL" || echo "no EVAL lines printed"

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Verify APK signature
        env:
          ALLOW_DEBUG: ${{ inputs.allow_debug_signing && 'true' || 'false' }}
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::ابزار apksigner پیدا نشد."
            exit 1
          fi
          CERT_INFO="$("$APKSIGNER" verify -v --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$CERT_INFO" | head -n 30
          if [ "$ALLOW_DEBUG" != "true" ] && echo "$CERT_INFO" | grep -q "CN=Android Debug"; then
            echo "::error::فایل خروجی با کلید Android Debug امضا شده است! آپلود متوقف شد."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dastyar-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Qwen3-0.6B-fas probe

# آزمایش، نه بخشی از برنامه: Qwen3-0.6B (اصلی با Q4/Q8، و نسخهٔ بریده‌شده برای
# فارسی با و بدون آموزش LoRA) روی همان جمله‌هایی که Noql سنجیده شد.
# هیچ مدلی وارد مخزن یا APK نمی‌شود.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'all = هر سه بخش؛ extra = فقط وارسی‌های تکمیلی'
        default: 'all'
        type: choice
        options: ['all', 'extra']

permissions:
  contents: write

jobs:
  gguf:
    if: inputs.stage == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install numpy huggingface_hub
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"
      - name: Run
        env:
          STAGE: gguf
        run: python dev/brain/qwen_probe.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add reports/qwen_gguf.md || true
          git commit -m "گزارش Qwen3-0.6B: Q4 در برابر Q8 [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done

  tuned:
    if: inputs.stage == 'extra' || inputs.stage == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scikit-learn transformers peft huggingface_hub
          pip list 2>/dev/null | grep -i -E "^(torch|transformers|peft|tokenizers|numpy) "
      - name: Run
        env:
          STAGE: hf
        run: python dev/brain/qwen_probe.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add reports/qwen_tuned.md || true
          git commit -m "گزارش Qwen3-0.6B-fas: بدون آموزش و با LoRA [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done

  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scikit-learn transformers peft huggingface_hub
          pip install llama-cpp-python --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          pip list 2>/dev/null | grep -i -E "^(torch|transformers|peft|tokenizers|numpy|llama_cpp_python) "
      - name: Run
        env:
          STAGE: extra
        run: python dev/brain/qwen_probe.py
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add reports/qwen_extra.md || true
          git commit -m "گزارش Qwen3-0.6B: وارسی‌های تکمیلی [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 7
          done
